spring.application.name=lab1
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:festivales}
spring.datasource.username=${DB_USER:festivales_user}
spring.datasource.password=${DB_PASSWORD:festivales_pass}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Convención JSON del equipo: snake_case, fechas ISO-8601
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Sin usuario en memoria de Spring Security (la autenticación es JWT propio contra la tabla usuario)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
