services:
  # BASE DE DATOS
  postgres:
    image: postgres:17
    container_name: festivales-db
    env_file: 
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-festivales}
      POSTGRES_USER: ${DB_USER:-festivales_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-festivales_pass}
      TZ: America/Santiago
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - festivales_pgdata:/var/lib/postgresql/data
      - ./db:/db:ro,z
      - ./db/init_all.sql:/docker-entrypoint-initdb.d/00_init_all.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # BACKEND (Spring Boot)
  backend:
    container_name: festivales-backend
    image: eclipse-temurin:21-jdk 
    working_dir: /app
    volumes:
      - ./back:/app:z
      - ~/.m2:/root/.m2:z
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    env_file: 
      - .env
    command: ./mvnw spring-boot:run
    depends_on:
      postgres:
        condition: service_healthy 

  # FRONTEND (React / Vite)
  frontend:
    container_name: festivales-frontend
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./front:/app:z
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file: 
      - .env
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  festivales_pgdata: